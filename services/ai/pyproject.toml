[project]
name = "ai-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "grpcio==1.85.1",
    "sentence-transformers==6.3.0",
    "pgvector==0.5.1",
    "protobuf==7.36.2",
    "psycopg2-binary==2.9.13"
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.62",            # .proto -> Python codegen
  "pytest>=8.0",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"