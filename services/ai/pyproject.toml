[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "proto-gen",
  "grpcio>=1.85.1",
  "sentence-transformers>=6.3.0",
  "qdrant-client>=1.20.0",
  "boto3==1.44.3",
  "asyncpg>=0.32.0",
  "numpy>=2.5.4",
]

[tool.uv.sources]
proto-gen = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
