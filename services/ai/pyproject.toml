[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "shared",
  "grpcio==1.85.1",
  "sentence-transformers==6.3.0",
  "pgvector==0.5.1",
  "protobuf==7.36.2",
  "psycopg2-binary==2.9.13",
  "boto3==1.44.3"
]

[project.optional-dependencies]
dev = [
  "grpcio-tools>=1.62",            # .proto -> Python codegen
  "pytest>=8.0",
  "ruff>=0.5",
  "pytest==9.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
shared = { workspace = true }