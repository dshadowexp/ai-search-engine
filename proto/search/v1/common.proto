syntax = "proto3";

package search.v1;

message Document {
    string id = 1;
    string url = 2;
    string title = 3;
    string text = 4;
    map<string, string> metadata = 5;
}

message Embedding {
    string document_id = 1;
    repeated float values = 2;
    string model = 3;
}

message SearchHit {
    string document_id = 1;
    string url = 2;
    string title = 3;
    string snippet = 4;
    float score = 5;
}