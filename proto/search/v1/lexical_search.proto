syntax = "proto3";

package search.v1;

option go_package = "cruwl/gen/lexicalsearchv1";

import "v1/common.proto";

service LexicalSearchService {
  // Searches the lexical index and returns the highest-ranked documents.
  rpc Search(LSearchRequest) returns (LSearchResponse);
}

message LSearchRequest {
  string query = 1;
  uint32 top_k = 2;
}

message LSearchResponse {
  repeated SearchHit results = 1;
}
