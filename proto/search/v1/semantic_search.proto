syntax = "proto3";

package search.v1;

option go_package = "cruwl/gen/semanticsearchv1";

import "v1/common.proto";

service SemanticSearchService {
    // Embeds the query, retrieves candidates, and returns ranked results.
    rpc Search(SSearchRequest) returns (SSearchResponse);

    // Reranks an existing candidate set for a query.
    rpc Rerank(RerankRequest) returns (RerankResponse);

    // Streams ranked results as they are produced by the retrieval pipeline.
    rpc SummaryStream(SummaryStreamRequest) returns (stream SummaryStreamResponse);
}

message SSearchRequest {
    string query = 1;
    uint32 top_k = 2;
    map<string, string> filters = 3;
}

message SSearchResponse {
    repeated SearchHit results = 1;
}

message RerankRequest {
    string query = 1;
    repeated SearchHit candidates = 2;
    uint32 top_k = 3;
}

message RerankResponse {
    repeated SearchHit results = 1;
}

message SummaryStreamRequest {
    string query = 1;
}

message SummaryStreamResponse {
    string summary = 1;
}
