syntax = "proto3";

package search.ai;

service EmbeddingService {
  rpc GenerateEmbeddings(stream Document)
      returns (EmbeddingBatchResult);
}

message Document {
  string document_id = 1;
  string url = 2;
  string title = 3;
  string content = 4;
  uint64 version = 5;
}

message EmbeddingBatchResult {
  repeated EmbeddingResult results = 1;
}

message EmbeddingResult {
  string document_id = 1;
  bool success = 2;
  string error = 3;
}