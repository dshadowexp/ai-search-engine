
services:

  # -------------------------
  # React / Next.js frontend
  # -------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      API_URL: http://api:4000

    depends_on:
      api:
        condition: service_healthy

    networks:
      - frontend
      - backend


  # -------------------------
  # Node.js REST API
  # -------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile

    expose:
      - "4000"

    environment:
      NODE_ENV: production
      PORT: 4000
      AI_GRPC_TARGET: ai:50051
      REDIS_URL: redis://redis:6379

    depends_on:
      ai:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3

    networks:
      - frontend
      - backend


  # -------------------------
  # Python AI server
  # -------------------------
  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile

    expose:
      - "50051"

    environment:
      MODEL_CACHE: /models

    volumes:
      - model-cache:/models

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc; channel = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(channel).result(timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - backend


  # -------------------------
  # Node.js crawler worker
  # -------------------------
  crawler:
    build:
      context: .
      dockerfile: services/crawler/Dockerfile

    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      AI_GRPC_TARGET: ai:50051

    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - backend


  # -------------------------
  # Node.js indexing worker
  # -------------------------
  indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile

    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      AI_GRPC_TARGET: ai:50051

    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - backend


  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:7-alpine

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

    networks:
      - backend


# -------------------------
# Networks
# -------------------------
networks:
  frontend:
  backend:
    internal: true


# -------------------------
# Persistent volumes
# -------------------------
volumes:
  redis-data:
  model-cache:
